services:
  mongodb:
    image: mongo:8.2.2-noble
    container_name: edgy-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  edgy-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edgy-service
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb

volumes:
  mongodb_data:
